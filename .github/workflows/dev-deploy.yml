name: dev-deploy

on:
  workflow_dispatch:
    inputs:
      destroy_resources:
        description: 'Delete all cloud resources to avoid unwanted costs'
        required: false
        default: false
        type: boolean
      destroy_foundry_agents:
        description: 'Delete only Foundry agents and model versions (preserves Foundry project)'
        required: false
        default: false
        type: boolean

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VAR_environment: dev
  TF_VAR_region: uksouth
  TF_VAR_container_registry_name: clinicflowaidev
  TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
  TF_STATE_RESOURCE_GROUP: clinicflow-ai-tfstate-rg
  TF_STATE_STORAGE_ACCOUNT: clinicflowaitfstate
  TF_STATE_CONTAINER: tfstate
  TF_STATE_KEY: clinicflow-ai.dev.tfstate
  IMAGE_TAG: ${{ github.sha }}
  API_IMAGE: clinicflowaidev.azurecr.io/clinicflow-ai-api:${{ github.sha }}
  GATEWAY_IMAGE: clinicflowaidev.azurecr.io/clinicflow-ai-gateway:${{ github.sha }}
  WEB_IMAGE: clinicflowaidev.azurecr.io/clinicflow-ai-web:${{ github.sha }}
  API_IMAGE_NAME: clinicflow-ai-api
  GATEWAY_IMAGE_NAME: clinicflow-ai-gateway
  WEB_IMAGE_NAME: clinicflow-ai-web

jobs:
  deploy-infrastructure-and-apps:
    # Run only for manual dispatch when no destruction mode is selected
    if: ${{ !inputs.destroy_resources && !inputs.destroy_foundry_agents }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight bootstrap prerequisites
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          python infra/scripts/preflight_deploy.py --mode bootstrap

      - name: Bootstrap Terraform state backend
        shell: bash
        run: |
          az group create --name "$TF_STATE_RESOURCE_GROUP" --location "$TF_VAR_region" 1>/dev/null
          if ! az storage account show --name "$TF_STATE_STORAGE_ACCOUNT" --resource-group "$TF_STATE_RESOURCE_GROUP" 1>/dev/null 2>&1; then
            az storage account create \
              --name "$TF_STATE_STORAGE_ACCOUNT" \
              --resource-group "$TF_STATE_RESOURCE_GROUP" \
              --location "$TF_VAR_region" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --allow-blob-public-access false 1>/dev/null
          fi
          az storage container create \
            --name "$TF_STATE_CONTAINER" \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --auth-mode login 1>/dev/null

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform apply base infrastructure
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="deploy_container_apps=false" \
            -var="deploy_postgres=true"

      - name: Capture Terraform outputs
        working-directory: infra/terraform
        run: |
          terraform output -json > ../../terraform-outputs.json

      - name: Preflight ACR role assignments
        shell: bash
        run: |
          python infra/scripts/preflight_deploy.py --mode post-base --terraform-outputs terraform-outputs.json

      - name: Login to Azure Container Registry
        shell: bash
        run: |
          az acr login --name "$TF_VAR_container_registry_name"

      - name: Build and push API image
        shell: bash
        run: |
          ACR_LOGIN_SERVER=$(python -c "import json; from pathlib import Path; data=json.loads(Path('terraform-outputs.json').read_text(encoding='utf-8')); print(data['container_registry_login_server']['value'])")
          docker build -f src/ClinicFlowAi.Api/Dockerfile -t "$API_IMAGE" -t "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:${GITHUB_SHA}" .
          docker push "$API_IMAGE"
          docker push "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:${GITHUB_SHA}"

      - name: Build and push Agent Gateway image
        shell: bash
        run: |
          ACR_LOGIN_SERVER=$(python -c "import json; from pathlib import Path; data=json.loads(Path('terraform-outputs.json').read_text(encoding='utf-8')); print(data['container_registry_login_server']['value'])")
          docker build -f src/ClinicFlowAi.AgentGateway/Dockerfile -t "$GATEWAY_IMAGE" -t "$ACR_LOGIN_SERVER/$GATEWAY_IMAGE_NAME:${GITHUB_SHA}" .
          docker push "$GATEWAY_IMAGE"
          docker push "$ACR_LOGIN_SERVER/$GATEWAY_IMAGE_NAME:${GITHUB_SHA}"

      - name: Build and push Web UI image
        shell: bash
        run: |
          ACR_LOGIN_SERVER=$(python -c "import json; from pathlib import Path; data=json.loads(Path('terraform-outputs.json').read_text(encoding='utf-8')); print(data['container_registry_login_server']['value'])")
          docker build -f src/ClinicFlowAi.Web/Dockerfile -t "$WEB_IMAGE" -t "$ACR_LOGIN_SERVER/$WEB_IMAGE_NAME:${GITHUB_SHA}" .
          docker push "$WEB_IMAGE"
          docker push "$ACR_LOGIN_SERVER/$WEB_IMAGE_NAME:${GITHUB_SHA}"

      - name: Terraform apply application layer
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="deploy_container_apps=true" \
            -var="api_image=${API_IMAGE}" \
            -var="gateway_image=${GATEWAY_IMAGE}" \
            -var="web_image=${WEB_IMAGE}"

      - name: Show deployed endpoints
        working-directory: infra/terraform
        run: terraform output

  deploy-foundry-agent:
    # Run only for manual dispatch when no destruction mode is selected
    if: ${{ !inputs.destroy_resources && !inputs.destroy_foundry_agents }}
    runs-on: ubuntu-latest
    needs: deploy-infrastructure-and-apps
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Foundry agent manifest
        shell: bash
        run: |
          test -f foundry/agent.manifest.yaml
          grep -q '^template:$' foundry/agent.manifest.yaml
          grep -q '^  kind: hosted$' foundry/agent.manifest.yaml

      - name: Install Foundry deployment dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install azure-identity azure-ai-projects httpx pyyaml

      - name: Preflight Foundry prerequisites
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT_NAME: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT_NAME }}
        run: |
          python infra/scripts/preflight_deploy.py --mode foundry

      - name: Deploy Foundry prompt agent version
        shell: bash
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT_NAME: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT_NAME }}
          FOUNDRY_AGENT_NAME: clinicflow-booking-assistant
          FOUNDRY_AGENT_INSTRUCTIONS: ${{ secrets.FOUNDRY_AGENT_INSTRUCTIONS }}
          CLINICFLOW_API_BASE_URL: ${{ secrets.CLINICFLOW_API_BASE_URL }}
          CLINICFLOW_GATEWAY_BASE_URL: ${{ secrets.CLINICFLOW_GATEWAY_BASE_URL }}
        run: |
          python foundry/scripts/deploy_prompt_agent.py

      - name: Upload Foundry deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: foundry-agent-deployment
          path: foundry/foundry-deployment-result.json

  cleanup-foundry-agents:
    # Only run if Foundry agent destruction is explicitly requested via workflow_dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy_foundry_agents }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Foundry dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install azure-identity azure-ai-projects pyyaml

      - name: Delete Foundry agents and models
        shell: bash
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_AGENT_NAME: clinicflow-booking-assistant
        run: |
          python foundry/scripts/cleanup_foundry_agents.py

      - name: Foundry cleanup summary
        shell: bash
        run: |
          echo "✅ Foundry cleanup complete"
          echo "All agent versions for 'clinicflow-booking-assistant' have been removed."
          echo "Note: Foundry project, AI resources, and model deployments were preserved."

  cleanup-resources:
    # Only run if destruction is explicitly requested via workflow_dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy_resources }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init for cleanup
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_azuread_auth=true"
        env:
          TF_IN_AUTOMATION: true
          TF_INPUT: false
          TF_VAR_environment: dev
          TF_VAR_region: uksouth
          TF_VAR_container_registry_name: clinicflowaidev
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

      - name: Terraform destroy
        # Note: provider unregistration (e.g. Microsoft.App) is intentionally
        # skipped via resource_provider_registrations = "none" in providers.tf.
        # Azure provider registration is subscription-level and must not be
        # unregistered here while other resources may still exist.
        working-directory: infra/terraform
        run: |
          terraform destroy -auto-approve
        env:
          TF_IN_AUTOMATION: true
          TF_INPUT: false
          TF_VAR_environment: dev
          TF_VAR_region: uksouth
          TF_VAR_container_registry_name: clinicflowaidev
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

      - name: Cleanup summary
        shell: bash
        run: |
          echo "✅ Resource cleanup complete"
          echo "All Azure resources defined in terraform have been destroyed."
          echo "Note: Terraform state backend storage account ($TF_STATE_STORAGE_ACCOUNT) was preserved to maintain state for future deployments."
